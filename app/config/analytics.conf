# --- Analitica de tráfico y tiempos recomendados ---

# Módulo: analytics (enlazado desde app.conf)
# Estas reglas generan las sugerencias de tiempo para los bloques de timers.conf;
# las sugerencias son solo informativas

[general]
# Ventana de historial de cruces (segundos)
history_window_s = 300
# Vehículos simultaneos que equivalen al 100 % de congestion
max_vehicles = 8
# Cada cuanto se actualizan los datos en vivo: números de la cámara,
# recomendaciones, estadísticas, gráficas e historial.
#   auto     = según el perfil de rendimiento (vision.conf update_interval_s)
#   realtime = tiempo real (cada medio segundo)
#   1, 2, 3, 5, 10 = cada tantos segundos (para PCs poco potentes)
update_interval = auto

[congestion_colors]
# Umbrales (%) para el color del indicador de congestion
level_medium = 40
level_high = 70

[green_B3]
# Niveles level_N evaluados en orden: flujo máximo (veh/min), vehículos máximos en escena, segundos
level_1 = 2, 1, 20
level_2 = 6, 3, 30
level_3 = 12, 5, 45
level_4 = 18, 999, 60
# Segundos si se supera el último nivel
saturation = 80
# Tiempo extra cuando hay congestion lenta (con tope en max_s)
congestion_speed_kmh = 15
congestion_min_vehicles = 3
congestion_extra_s = 15
max_s = 90

[yellow_B21]
# Velocidad (km/h) por encima de la cual se usa cada tiempo
high_speed_kmh = 50
seconds_high = 5
medium_speed_kmh = 30
seconds_medium = 4
seconds_low = 3

[red_nowait_B6]
# Niveles level_N evaluados en orden: flujo máximo (veh/min), segundos
# seconds_high se usa si se supera el último nivel
level_1 = 3, 25
level_2 = 10, 35
seconds_high = 50

[red_wait_B13]
# Con congestion_vehicles o más vehículos se usa seconds_congestion; si no, seconds_normal
congestion_vehicles = 5
seconds_congestion = 55
seconds_normal = 45

[fixed]
# Tiempos de parpadeo (no dependen del tráfico): se recomienda este valor fijo
blink_B11 = 3
blink_B16 = 5

[history]
# Días que se conservan en data/traffic_history.sqlite3 (0 = para siempre)
retention_days = 180

[alarms]
# Ocupación de la via (%) sostenida para disparar la alarma de congestion
congestion_pct = 75
# Segundos que debe mantenerse la congestion antes de avisar
congestion_delay_s = 60
# Vehículos detenidos para la alarma de cola larga
queue_vehicles = 6
queue_delay_s = 30
# Segundos sin video antes de avisar
no_video_delay_s = 10
