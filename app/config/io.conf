# --- Mapa de entradas y salidas digitales del Logo ---

# Módulo: io (enlazado desde app.conf)
#
# Cada sección [Qx] / [Ix] es una señal que aparece como tarjeta en el HMI.
# Las tarjetas se crean en el mismo orden en que están en este archivo.
#
#   kind       output | input
#   bit        Posición dentro del byte leído (0 = Q1/I1, 1 = Q2/I2 ... 7 = Q8/I8)
#              Los bytes se definen en plc.conf -> outputs_byte / inputs_byte
#   name       Texto que se muestra en la tarjeta
#   color      green | yellow | red | cyan | orange | blue (ver [Signal_colors] en theme.conf)
#   visible    true = se muestra en el HMI | false = se oculta
#   log        Texto que se escribe en la bitácora cuando la señal esta activa
#              (vacío = no se registra)
#   stopwatch  true = muestra cuanto tiempo lleva activa (solo salidas)
#
# Para agregar una señal se copia un bloque y se cambian la sección [Qx] / [Ix], el bit y los textos.

[layout]
# Tarjetas por fila en cada grupo
output_columns = 3
input_columns = 3
# Títulos de cada grupo
outputs_title = Salidas Digitales (Q)
inputs_title = Entradas Digitales (I)

# --- Salidas ---

[Q1]
kind = output
bit = 0
name = Luz Verde
color = green
visible = true
log = Q1:Verde
stopwatch = true

[Q2]
kind = output
bit = 1
name = Luz Amarilla
color = yellow
visible = true
log = Q2:Amarillo
stopwatch = true

[Q3]
kind = output
bit = 2
name = Luz Roja
color = red
visible = true
log = Q3:Rojo
stopwatch = true

[Q4]
kind = output
bit = 3
name = Circuito Activo
color = cyan
visible = true
log = Q4:Activo
stopwatch = true

[Q5]
kind = output
bit = 4
name = Circuito Inactivo
color = orange
visible = true
log = Q5:Paro
stopwatch = true

# --- Entradas ---

[I1]
kind = input
bit = 0
name = Pulsador Marcha
color = green
visible = true
log = I1:Marcha

[I2]
kind = input
bit = 1
name = Pulsador Paro
color = red
visible = true
log = I2:Paro

[I3]
kind = input
bit = 2
name = Cruce Peatonal
color = blue
visible = true
log = I3:Peaton
