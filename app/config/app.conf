# --- Logo Traffic HMI: configuración general (archivo maestro) ---

# Archivo principal: desde aquí se enlazan los demás archivos .conf de la
# carpeta app/config/.
#
# Reglas de edición:
#   - Formato: clave = valor (sin comillas)
#   - Comentarios en líneas propias que empiecen con # o ;
#   - Las rutas relativas se resuelven desde la carpeta raiz del proyecto
#   - Booleanos: true / false
#   - Los cambios se aplican al reiniciar la aplicación (los colores y estilos
#     se pueden recargar en caliente con la tecla reload_styles_key de ui.conf)

[general]
name = LOGO! Traffic HMI
window_title = LOGO! Traffic HMI - Control & Visión Artificial
version = 1.0.0

[modules]
# Módulo logico = archivo .conf dentro de app/config/
# El código lee los valores con cfg.get("<módulo>", "<sección>", "<clave>")
plc = plc.conf
timers = timers.conf
camera = camera.conf
vision = vision.conf
analytics = analytics.conf
ui = ui.conf
theme = theme.conf
io = io.conf

[paths]
# Recursos del programa
icons_dir = app/assets/icons
styles_dir = app/ui/styles
app_icon = app/assets/icons/logo_traffic_hmi.png
# Datos generados al usar la app (fuera de app/, en la raiz del proyecto)
data_dir = data
logs_dir = logs
# Modelos YOLO (.pt) y sus versiones optimizadas para OpenVINO
models_dir = models
# Base de datos SQLite principal de la app
database = data/logo_traffic_hmi.sqlite3

[logging]
# Prefijo del archivo de bitácora de cada sesión
session_prefix = session
# Cantidad máxima de archivos de sesión a conservar (0 = sin límite).
# Con 30, por ejemplo, los registros más antiguos se borran al iniciar.
max_session_files = 0
