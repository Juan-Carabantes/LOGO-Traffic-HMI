# --- Interfaz de usuario: ventana, navegación y hojas de estilo ---

# Módulo: ui (enlazado desde app.conf)
# Los colores están en theme.conf; los estilos en app/ui/styles/*.css

[window]
# Tamaño mínimo de la ventana (px)
min_width = 1100
min_height = 680
start_maximized = true
# Altura de la barra superior (px)
top_bar_height = 60
# Escala de la interfaz: auto = según la pantalla (1920x1080 = 100)
# o un porcentaje fijo, por ejemplo 90. Se aplica al reiniciar la app.
scale = auto

[theme]
# auto = sigue el tema de Windows | dark | light
theme_mode = auto
# Tecla para recargar colores y hojas de estilo sin reiniciar
reload_styles_key = F5

[fonts]
# Tamaño de cada tipo de letra en puntos (pt), con la escala al 100 %.
# Cada elemento conserva su proporción dentro de su grupo.
# Texto general: controles, botones, menus y tablas
text = 10
# Título de cada página (Configuración, Estadísticas...)
page_title = 17
# Título de cada tarjeta
card_title = 11
# Subtitulos y descripciones debajo de los títulos
subtitle = 8.5
# Etiquetas, ayudas, detalles y textos pequeños
small = 8.5
# Números grandes de los indicadores
value = 22
# Registro de eventos (terminal)
log = 7

[sidebar]
# Estado inicial y medidas de la barra lateral (px)
sidebar_expanded = true
expanded_width = 232
collapsed_width = 68
button_height = 42
icon_size = 20

[styles]
# Orden de carga de las hojas de estilo (relativo a app/ui/styles/).
# Las últimas tienen prioridad si repiten un selector.
files =
    base/global.css
    base/typography.css
    base/forms.css
    base/buttons.css
    base/scrollbars.css
    components/card.css
    components/status_chip.css
    components/stat_card.css
    components/segmented.css
    components/table.css
    layout/sidebar.css
    layout/top_bar.css
    widgets/io_tile.css
    views/hmi_view.css
    views/camera_view.css
    views/analytics_view.css
    views/recommendations_view.css
    views/settings_view.css
    dialogs/alarms_popup.css
