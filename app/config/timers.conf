# --- Temporizadores del programa del Logo ---

# Módulo: timers (enlazado desde app.conf)
#
# Solo lectura: el Logo no permite cambiar los tiempos desde la app.
# Se usan en la página Recomendaciones para comparar el tiempo actual con el recomendado.
#
# Cada sección [Bx] es un bloque de temporizador del Logo.
#   name          Texto que se muestra
#   description   Texto de ayuda
#   seconds       Tiempo programado en Logo Soft (se muestra si no se lee del Logo)
#   output        Salida o entrada asociada
#   in_analytics  true = aparece en la página Recomendaciones
#   reason        Motivo inicial que se muestra en su tarjeta
#   vw_read       Dirección VW donde el Logo publica el parámetro T del bloque
#                 (Logo Soft Comfort: Herramientas > Asignación de parámetros a VM).
#                 0 = no leer; se muestra seconds.

[B3]
name = Piloto verde
description = Tiempo de la luz verde vehicular (Q1)
seconds = 80
output = Q1
in_analytics = true
reason = Flujo vehicular
vw_read = 0

[B21]
name = Piloto amarillo
description = Tiempo de la luz amarilla de precaución (Q2)
seconds = 3
output = Q2
in_analytics = true
reason = Velocidad de la vía
vw_read = 0

[B6]
name = Piloto rojo
description = Tiempo de la luz roja en el ciclo normal (Q3)
seconds = 50
output = Q3
in_analytics = true
reason = Ciclo equilibrado
vw_read = 0

[B13]
name = Cruce de peatones
description = Luz roja extendida al pedir el cruce peatonal (I3/M3)
seconds = 45
output = I3/M3
in_analytics = true
reason = Seguridad del cruce peatonal
vw_read = 0

[B11]
name = Tiempo de parpadeo
description = Parpadeo de la señal de advertencia (B11)
seconds = 3
output = Q4
in_analytics = true
reason = Tiempo fijo
vw_read = 0

[B16]
name = Tiempo de parpadeo
description = Parpadeo de la señal de advertencia (B16)
seconds = 5
output = Q2
in_analytics = true
reason = Tiempo fijo
vw_read = 0
