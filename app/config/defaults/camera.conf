# --- Valores de fabrica ---

# Solo lectura. Los usa el botón "Restablecer" de cada área en Configuración.
# La configuración real del usuario esta en app/config/.

# --- Cámara, fuente de video y grabación ---

# Módulo: camera (enlazado desde app.conf)

[source]
# Tipo de fuente: usb | stream | file
source_type = usb
# Índice DirectShow de la cámara USB y su nombre (se llenan desde Configuración)
device_index = 0
device_name =
# URL RTSP / HTTP de cámara IP
stream_url =
# Video local para pruebas (se reproduce en bucle)
video_file =

[capture]
# Resolución y cuadros por segundo solicitados a la cámara
width = 1280
height = 720
fps = 30
# Cuadros por segundo máximos que se dibujan en pantalla (la IA va en su propio hilo)
max_screen_fps = 30
# Cantidad de indices a probar si no se detectan cámaras por nombre
max_search_indexes = 4
# Metodos de OpenCV para abrir la cámara, en orden de prueba:
#   dshow = DirectShow | msmf = Media Foundation | any = automático
backends = dshow, msmf, any

[recording]
# Carpeta de grabaciones (relativa a la raiz del proyecto o absoluta)
recordings_dir = recordings
# Prefijo del archivo MP4 generado
file_prefix = traffic
# Codec FourCC
codec = mp4v
# Cuadros por segundo del archivo: se toman de la pantalla real; este valor
# es el respaldo si todavía no se midieron
recording_fps = 25

[no_signal]
# Si no hay cámara, se reintenta abrirla cada N segundos (por ejemplo, al iniciar OBS)
retry_s = 5

[hud]
# Panel de información dibujado sobre el video (también queda en las grabaciones)
show = true
show_datetime = true
show_source = true
show_fps = true
show_count = true
show_calibration = true
# Formato de fecha y hora (codigos de strftime de Python)
datetime_format = %d/%m/%Y  %H:%M:%S
# Opacidad del fondo del panel (0.0 - 1.0)
background_opacity = 0.55
