# --- Valores de fabrica ---

# Solo lectura. Los usa el botón "Restablecer" de cada área en Configuración.
# La configuración real del usuario esta en app/config/.

# --- Tema visual: paletas de color, señales y tipografía ---

# Módulo: theme (enlazado desde app.conf)
#
# Cada clave se usa en las hojas de estilo (app/ui/styles/*.css) con la
# sintaxis var(--clave). Ejemplos:
#     background-color: var(--area);
#     color: var(--signal_green);
#     font-family: var(--font_family);
#
# Prefijos que se generan automáticamente:
#     [Signal_colors] / [Signal_colors_light]  -> var(--signal_<color>)
#     [Signal_backgrounds_*]                   -> var(--signal_bg_<color>)
#     [Traffic_light]                          -> var(--traffic_light_<clave>)
#     [Video_surface]                          -> var(--video_<clave>)
# El modo (dark / light) se elige en ui.conf -> theme_mode o en
# Configuración > Apariencia. La tecla de ui.conf -> reload_styles_key (F5)
# recarga los colores dentro de la app.

# --- Modo oscuro ---

[DarkMode_colors]
# Fondos (de más profundo a más elevado)
window = #0b0e14
sidebar = #0f131a
area = #141922
alternative_area = #1a202b
active_area = #1b2638
# Bordes
border = #222a37
border_strong = #313b4c
# Texto
text = #e7ecf3
soft_text = #8d99ab
muted_text = #5f6b7d
# Acento (botones principales, selección, enlaces)
accent = #4d8dff
accent_hover = #6a9fff
accent_soft = #16233a
on_accent = #ffffff
# Campos y botones secundarios
field = #0f141c
button = #1a202b
button_hover = #222a37
button_pressed = #131820
# Consola del registro de eventos
register = #0a0d12
register_border = #222a37
register_text = #a9d9b8
# Estados
success = #3ddc84
success_bg = #11271c
warning = #f5b94a
warning_bg = #2b2212
error = #ff6b6b
error_bg = #2d1618
neutral = #9aa6b8
neutral_bg = #1a202b
info = #6aa8ff
info_bg = #152036
disconnect_button = #d9434a

# --- Modo claro ---

[LightMode_colors]
window = #f3f5f9
sidebar = #ffffff
area = #ffffff
alternative_area = #f5f7fa
active_area = #eaf1ff
border = #e3e8ef
border_strong = #cfd7e3
text = #111827
soft_text = #5b6677
muted_text = #97a1b0
accent = #2563eb
accent_hover = #1d4fd7
accent_soft = #eaf1ff
on_accent = #ffffff
field = #ffffff
button = #ffffff
button_hover = #f3f6fa
button_pressed = #e7ecf3
register = #0f172a
register_border = #1e293b
register_text = #a9d9b8
success = #15803d
success_bg = #dcfce7
warning = #b45309
warning_bg = #fef3c7
error = #dc2626
error_bg = #fee2e2
neutral = #475569
neutral_bg = #f1f5f9
info = #2563eb
info_bg = #eaf1ff
disconnect_button = #dc2626

# --- Colores de señalización (modo oscuro) ---

[Signal_colors]
green = #22d67a
yellow = #f7c948
red = #ff5a5f
cyan = #2fd3e8
orange = #ff8a3d
blue = #4d8dff

# --- Colores de señalización (modo claro, tonos legibles) ---

[Signal_colors_light]
green = #15803d
yellow = #a16207
red = #dc2626
cyan = #0e7490
orange = #c2410c
blue = #2563eb

# --- Fondo de tarjetas y botones activos por señal (modo oscuro) ---

[Signal_backgrounds_dark]
green = #0f2a1d
yellow = #2b2410
red = #2e1518
cyan = #0d2830
orange = #2e1c10
blue = #14223b

# --- Fondo de tarjetas y botones activos por señal (modo claro) ---

[Signal_backgrounds_light]
green = #e7f8ee
yellow = #fdf6dc
red = #fdecec
cyan = #e3f6fa
orange = #fdefe4
blue = #eaf1ff

# --- Tipografía ---

[Typography]
font_family = 'Segoe UI Variable Text', 'Segoe UI', 'Inter', Arial, sans-serif
font_display = 'Segoe UI Variable Display', 'Segoe UI Semibold', 'Segoe UI', Arial, sans-serif
font_mono = 'Cascadia Mono', Consolas, 'DejaVu Sans Mono', monospace
# Los tamaños de letra se ajustan en ui.conf [fonts]

# --- Semáforo del HMI (app/ui/widgets/traffic_light.py) ---

[Traffic_light]
housing = #171b22
frame = #2c3441
pole = #262c37
visor = #07090c
lens_border = #040506
red_on = #ff3b3b
red_off = #3a1113
yellow_on = #ffc629
yellow_off = #3a2e0c
green_on = #1fe07a
green_off = #0b3120

# --- Superficie de video ---

[Video_surface]
background = #07090d
placeholder_text = #6b778a
handle_a = #22d67a
handle_b = #ff5a5f

# --- Dibujo sobre el video (OpenCV) ---

# Valores en #RRGGBB
[Video_overlay]
counting_line = #ffd23f
point_a = #22d67a
point_b = #ff5a5f
point_a_text = #000000
point_b_text = #ffffff
box_counted = #22d67a
box_pending = #4d8dff
label_background = #0b0e14
label_text = #ffffff
recording = #ff3b3b
# Borde de la zona de detección
zone = #50c8ff
# Rectangulo de calibración (modo plane)
calibration = #c084fc
