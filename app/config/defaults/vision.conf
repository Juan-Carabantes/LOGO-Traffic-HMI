# --- Valores de fabrica ---

# Solo lectura. Los usa el botón "Restablecer" de cada área en Configuración.
# La configuración real del usuario esta en app/config/.

# --- Visión artificial: detección, seguimiento, líneas de conteo y calibración ---

# Módulo: vision (enlazado desde app.conf)

[detection]
# Perfil de rendimiento: auto | low | medium | high (ver [profile_*] al final).
# "auto" usa el perfil sugerido según el hardware detectado ([hardware_rules]).
profile = auto
# Motor de inferencia: auto | openvino | pytorch
#   openvino: la IA va ~3 veces más rápido en CPU Intel/AMD
#   auto:     usa OpenVINO y, si falla, PyTorch
engine = auto
# Confianza mínima POR TIPO (0.0 - 1.0). Se baja si no detecta ese tipo
# y se sube si aparecen detecciones falsas de ese tipo.
car_confidence = 0.4
motorcycle_confidence = 0.25
bus_confidence = 0.45
truck_confidence = 0.45
# Solapamiento máximo entre cajas (IoU). Más bajo = elimina más duplicados.
iou_nms = 0.5
# Una caja se considera duplicada si otra la cubre en esta fracción
contain_overlap = 0.8
# Una sola caja por vehículo aunque YOLO lo vea como dos clases (auto + camión)
class_agnostic_nms = true
# Descarta cajas más pequeñas que este porcentaje de la imagen
min_area_pct = 0.03
# Seguidor de ultralytics: bytetrack.yaml | botsort.yaml
tracker = bytetrack.yaml

[tracker_tuning]
# Ajustes finos del seguidor (ByteTrack / BoT-SORT)
# Confianza para asociar en la primera pasada / en la segunda (detecciones débiles)
high_thresh = 0.25
low_thresh = 0.1
# Confianza mínima para crear un vehículo nuevo
new_thresh = 0.25
# Cuadros analizados que se recuerda un vehículo perdido (tapado por otro)
buffer_frames = 45
# Exigencia para unir una detección con un vehículo ya seguido (0.0 - 1.0)
match_thresh = 0.8
# Solo para cámaras que se mueven (BoT-SORT). Con cámara fija conviene false: consume CPU
camera_motion_comp = false

[zone]
# Zona de detección: fuera de ella se ignora todo (letreros, aceras...).
# Se dibuja desde la página Cámara con el botón "Zona".
active = false
# Esquinas normalizadas (x, y de 0.0 a 1.0) separadas por ;
points = 0.0500, 0.0500; 0.9500, 0.0500; 0.9500, 0.9500; 0.0500, 0.9500
# Ocultar objetos que nunca se mueven (letreros detectados como vehículos)
hide_fixed_objects = true
# Segundos quieto en el mismo sitio desde que aparece para considerarlo fijo
fixed_object_s = 45

[tracking]
# Cuadros mínimos que un vehículo debe verse antes de poder contarse
min_hits = 3
# Movimiento de la caja: segundos de detecciones usados para calcular su recorrido
# (más alto = más suave pero reacciona más lento a frenadas y giros)
smoothing_window_s = 0.5
# Segundos en que se reparte cada corrección de la IA (0 = saltar de golpe)
motion_smoothing_s = 0.15
# Segundos sin ver un vehículo antes de olvidarlo
forget_s = 1.0
# Segundos que se sigue dibujando un vehículo que la IA perdio un instante (evita parpadeo)
lost_visible_s = 0.5
# Cada cuanto se actualiza la velocidad que se muestra (segundos)
speed_interval_s = 1
# Ventana de tiempo usada para medir la velocidad (segundos)
speed_window_s = 1.0
# Por debajo de esta velocidad un vehículo se considera detenido (cola)
stopped_speed_kmh = 5

[display]
# Elementos dibujados sobre cada vehículo
show_boxes = true
show_class = true
show_speed = true
# Mostrar la estela (trayectoria reciente) de cada vehículo
show_trail = true

# --- Líneas de conteo ---

# Se crean, mueven y eliminan desde la página Cámara; cada una es una sección [line_N].
#   a / b   Extremos normalizados (x, y) de 0.0 a 1.0
#   name    Texto que se muestra sobre la línea
# Un vehículo se cuenta cuando su punto de apoyo (centro inferior de la caja)
# cruza el segmento A-B. El sentido se registra por separado.

[line_1]
name = Línea 1
a = 0.15, 0.65
b = 0.85, 0.65

[calibration]
# plane  = 4 esquinas de un rectangulo marcado sobre la calzada (recomendado, el más exacto)
# auto   = aprende la escala con el tamaño de los vehículos detectados (aproximado)
# manual = un segmento de largo conocido (solo si la cámara mira de frente)
mode = plane
# Modo plane: esquinas normalizadas en orden (1-2 = ancho, 2-3 = largo).
# Se marcan desde Cámara > Calibrar > Plano de 4 puntos
plane_points =
plane_width_m = 3.5
plane_length_m = 6
# Modo manual: segmento de referencia (normalizado) y su largo real
ref_a = 0.3, 0.8
ref_b = 0.7, 0.8
ref_meters = 3.5
# Modo auto: ancho real promedio de cada tipo de vehículo (m)
car_width_m = 1.8
motorcycle_width_m = 0.8
bus_width_m = 2.55
truck_width_m = 2.5
# Muestras mínimas antes de confiar en la escala aprendida
min_samples = 25
# Escala aprendida (la app la guarda sola; no hace falta editarla)
auto_a = 0
auto_b = 0
auto_samples = 0
# Velocidad máxima admitida en el calculo (km/h)
max_speed_kmh = 160

[hardware_rules]
# Reglas para sugerir el perfil automáticamente
high_min_threads = 12
high_min_ram_gb = 16
medium_min_threads = 6
medium_min_ram_gb = 8

# --- Perfiles de rendimiento ---

#   name      Nombre descriptivo del perfil
#   imgsz     Resolución de análisis (lado mayor, multiplo de 32). Se usa la
#             proporción del video: 640 en video 16:9 analiza 640x384.
#             Más alto = detecta mejor motos y vehículos lejanos, pero más lento.
#   device    cpu | gpu (gpu usa CUDA si hay tarjeta NVIDIA; si no, CPU)
#   model     Modelo YOLO. Se descarga a models/ la primera vez (requiere
#             internet). yolo26 = el más nuevo, mejor con objetos pequeños.
#             Si falla se usa yolo11n.pt o yolov8n.pt.
#   max_det   Máximo de detecciones por cuadro
#   update_interval_s  Segundos entre actualizaciones de datos en pantalla cuando
#                      analytics.conf update_interval = auto
#   ai_max_fps         Análisis de IA por segundo como máximo (0 = sin límite);
#                      en PCs basicas deja CPU libre para el resto del sistema
#
# Referencia (CPU de 4 nucleos, OpenVINO, video 16:9):
#   yolo26n 640 ~ 25 ms · yolo26s 640 ~ 40 ms · yolo26s 800 ~ 60 ms por análisis

[profile_low]
name = Bajo (CPU básica / Ahorro)
imgsz = 480
device = cpu
model = yolo26n.pt
max_det = 40
update_interval_s = 3
ai_max_fps = 6

[profile_medium]
name = Medio (CPU moderna)
imgsz = 640
device = cpu
model = yolo26n.pt
max_det = 60
update_interval_s = 2
ai_max_fps = 12

[profile_high]
name = Alto (Alta precisión)
imgsz = 640
device = gpu
model = yolo26s.pt
max_det = 100
update_interval_s = 1
ai_max_fps = 0
