# --- Valores de fabrica ---

# Solo lectura. Los usa el botón "Restablecer" de cada área en Configuración.
# La configuración real del usuario esta en app/config/.

# --- Comunicación Ethernet S7 con el Logo ---

# Módulo: plc (enlazado desde app.conf)

[connection]
# Dirección IP del Logo (también se edita desde la barra superior)
ip = 192.168.0.3
# TSAP en formato hexadecimal (deben coincidir con la conexión S7 configurada en el Logo)
tsap_local = 0x0300
tsap_remote = 0x0200
# Parámetros de conexión del cliente snap7
rack = 0
slot = 1
port = 102
# Reintentar la conexión automáticamente si se pierde el enlace
auto_reconnect = true
# Segundos entre cada intento de reconexión
retry_s = 5

[polling]
# Periodo de lectura de entradas y salidas (ms)
poll_interval_ms = 100
# Duración del pulso enviado a M1/M2/M3 (ms)
control_pulse_ms = 100
# Tiempo de espera al detener el hilo de comunicación (ms)
stop_timeout_ms = 1500

[memory_map]
# Mapa de memoria VM del Logo expuesto como DB
db_number = 1
# Byte de entradas I1..I8
inputs_byte = 1024
# Byte de salidas Q1..Q8
outputs_byte = 1064
# Byte de marcas M1..M8 (control remoto)
markers_byte = 1104

[control_bits]
# Bit dentro de markers_byte para cada orden remota
start = 0
stop = 1
pedestrian = 2

[timers]
# Solo LECTURA del tiempo de los temporizadores (el Logo no permite cambiarlos desde la app).
# En Logo Soft Comfort (Herramientas > Asignación de parámetros a VM) se asigna el
# parámetro T de cada temporizador a una palabra VW y esa dirección se escribe en
# timers.conf -> vw_read. Si no se asigna, se muestra el valor seconds de timers.conf.
read_times = true
# Cada cuantos segundos se leen
read_interval_s = 2
# Segundos = valor leído / factor. Con base de tiempo "s (s:1/100 s)" se usa 100.
factor = 100
